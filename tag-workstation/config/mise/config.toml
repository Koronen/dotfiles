min_version = { hard = "2026.9.2", soft = "2026.9.16" }

[bootstrap.hooks.pre-dotfiles]
run = [
  "git -C ~/.dotfiles submodule init --quiet",
  "git -C ~/.dotfiles submodule update --recursive",
]

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:curl" = "latest"
"apt:rcm" = "latest"
"apt:vim" = "latest"
"apt:vim-ctrlp" = "latest"
"apt:vim-solarized" = "latest"
"apt:zsh" = "latest"

[bootstrap.repos]
"~/.dotfiles" = { url = "git@github.com:Koronen/dotfiles.git" }

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[dotfiles]
"~/.aliases" = "~/.dotfiles/aliases"
"~/.aliases.d" = { source = "~/.dotfiles/aliases.d", mode = "symlink-each" }
"~/.config/mise/config.toml" = "~/.dotfiles/tag-workstation/config/mise/config.toml"
"~/.config/shenv.d" = { source = "~/.dotfiles/config/shenv.d", mode = "symlink-each" }
"~/.local/share/zsh/functions/prompt_koronen_setup" = "~/.dotfiles/local/share/zsh/functions/prompt_koronen_setup"
"~/.zsh/bundle" = "~/.dotfiles/zsh/bundle"
"~/.zsh/rc.d" = "~/.dotfiles/zsh/rc.d"
"~/.zshenv" = "~/.dotfiles/zshenv"
"~/.zshrc" = "~/.dotfiles/zshrc"

[settings]
auto_install = false
disable_hints = ["auto_update"]
idiomatic_version_file_enable_tools = ["node", "ruby"]
minimum_release_age = "3d"

[settings.ruby]
default_packages_file = "~/.config/ruby/default-gems"

[settings.self_update]
minimum_release_age = "24h"

[tools]
aube = "2"
gh = "2"
node = "lts"
prettier = "3"
ruby = "4"
sops = "3"
yamlfmt = "latest"
