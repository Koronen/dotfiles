min_version = { hard = "2026.9.2", soft = "2026.9.16" }

[tasks.format]
alias = "f"
description = "Format all files"
run = "hk fix --all"

[tasks.lint]
alias = "n"
description = "Lint all files"
run = "hk check --all"

[tasks.pre-commit]
run = "hk run pre-commit"

[tools]
hk = "2"
pkl = "latest"
yamlfmt = "latest"
